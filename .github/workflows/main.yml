name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Full 5-Tab ElevenStudio Project and Build APK
        run: |
          mkdir -p app/src/main/java/io/elevenlabs/clone app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ElevenStudio"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.5.0' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'io.elevenlabs.clone'
              compileSdk 34
              defaultConfig {
                  applicationId "io.elevenlabs.clone"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="ElevenStudio AI"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/io/elevenlabs/clone/MainActivity.java
          package io.elevenlabs.clone;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              private WebView webView;
              private TextToSpeech tts;
              private MediaPlayer mediaPlayer;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  tts = new TextToSpeech(this, this);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void speakOffline(String text, float pitch, float rate, String accent) {
                      if (tts == null) return;
                      if (accent != null && accent.toLowerCase().contains("indian")) {
                          tts.setLanguage(new Locale("en", "IN"));
                      } else if (accent != null && accent.toLowerCase().contains("british")) {
                          tts.setLanguage(Locale.UK);
                      } else {
                          tts.setLanguage(Locale.US);
                      }
                      tts.setPitch(Math.max(0.5f, Math.min(2.0f, pitch)));
                      tts.setSpeechRate(Math.max(0.5f, Math.min(2.0f, rate)));
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "utt_" + System.currentTimeMillis());
                  }

                  @JavascriptInterface
                  public void speakElevenApi(String apiKey, String voiceId, String modelId, String text, float stab, float sim, float style, float fallbackPitch, float fallbackRate, String accent) {
                      new Thread(() -> {
                          try {
                              URL url = new URL("https://api.elevenlabs.io/v1/text-to-speech/" + voiceId);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("POST");
                              conn.setRequestProperty("xi-api-key", apiKey.trim());
                              conn.setRequestProperty("Content-Type", "application/json");
                              conn.setRequestProperty("Accept", "audio/mpeg");
                              conn.setDoOutput(true);
                              String safeText = text.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", " ");
                              String json = "{\"text\":\"" + safeText + "\",\"model_id\":\"" + modelId + "\",\"voice_settings\":{\"stability\":" + stab + ",\"similarity_boost\":" + sim + ",\"style\":" + style + ",\"use_speaker_boost\":true}}";
                              try (OutputStream os = conn.getOutputStream()) {
                                  os.write(json.getBytes(StandardCharsets.UTF_8));
                              }
                              if (conn.getResponseCode() == 200) {
                                  File out = new File(getCacheDir(), "eleven_out.mp3");
                                  try (InputStream is = conn.getInputStream(); FileOutputStream fos = new FileOutputStream(out)) {
                                      byte[] buf = new byte[4096];
                                      int n;
                                      while ((n = is.read(buf)) != -1) fos.write(buf, 0, n);
                                  }
                                  runOnUiThread(() -> {
                                      stopAll();
                                      try {
                                          mediaPlayer = new MediaPlayer();
                                          mediaPlayer.setDataSource(out.getAbsolutePath());
                                          mediaPlayer.prepare();
                                          mediaPlayer.start();
                                          Toast.makeText(MainActivity.this, "Playing ElevenLabs Cloud Audio", Toast.LENGTH_SHORT).show();
                                      } catch (Exception e) {
                                          speakOffline(text, fallbackPitch, fallbackRate, accent);
                                      }
                                  });
                              } else {
                                  runOnUiThread(() -> speakOffline(text, fallbackPitch, fallbackRate, accent));
                              }
                          } catch (Exception e) {
                              runOnUiThread(() -> speakOffline(text, fallbackPitch, fallbackRate, accent));
                          }
                      }).start();
                  }

                  @JavascriptInterface
                  public void stopAll() {
                      if (tts != null) tts.stop();
                      if (mediaPlayer != null) {
                          try { mediaPlayer.stop(); mediaPlayer.release(); } catch (Exception ignored) {}
                          mediaPlayer = null;
                      }
                  }
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS && tts != null) tts.setLanguage(Locale.US);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Roboto, sans-serif; }
            body { background: #09090b; color: #f4f4f5; padding-bottom: 130px; }
